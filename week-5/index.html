<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Utkarsh Notes is a student learning website with subjects, notes and study resources.">

    <title>Utkarsh Notes</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <!-- Skip Link -->
    <a class="skip-link" href="#app">
        Skip to main content
    </a> 

    <!-- Header -->
    <header class="site-header">

        <div class="container navbar">

            <a href="#/home" class="logo" data-route="home">
                UTKARSH <span>NOTES</span>
            </a>

            <nav class="navigation" aria-label="Main Navigation">

                <a href="#/home"
                   data-route="home">
                    Home
                </a>

                <a href="#/subjects"
                   data-route="subjects">
                    Subjects
                </a>

                <a href="#/notes"
                   data-route="notes">
                    Notes
                </a>

                <a href="#/contact"
                   data-route="contact">
                    Contact
                </a>

            </nav>

        </div>

    </header>


    <!-- Main SPA Container -->
    <main id="app"
          class="app-container"
          tabindex="-1"
          aria-live="polite">
    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="container footer-content">

            <p>
                © 2026 Utkarsh Notes
            </p>

            <nav class="footer-links"
                  aria-label="Footer Navigation">

                <a href="#/home"
                   data-route="home">
                    Home
                </a>

                <a href="#/contact"
                   data-route="contact">
                    Contact
                </a>

            </nav>

        </div>

    </footer>

</body>

</html>
